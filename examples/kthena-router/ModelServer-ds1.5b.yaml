apiVersion: networking.serving.volcano.sh/v1alpha1
kind: ModelServer
metadata:
  name: deepseek-r1-1-5b
  namespace: default
spec:
  workloadSelector:
    matchLabels:
      app: deepseek-r1-1-5b
  workloadPort:
    port: 8000
  model: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
  inferenceEngine: "vLLM"
  trafficPolicy:
    timeout: 10s
    # Per-ModelServer upstream connection pool. Omit to use the shared default
    # pool (maxIdle 100, per-host 64, unlimited, idleTimeout 90s).
    connectionPool:
      maxIdleConnections: 100
      maxIdleConnectionsPerHost: 64
      maxConnectionsPerHost: 0   # 0 means unlimited
      idleTimeout: 90s
