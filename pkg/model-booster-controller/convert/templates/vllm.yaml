# =============================================================================
# vLLM 单 Role 模板 — leader Role(ModelBooster vLLM 后端用, 非分离)
# =============================================================================
# 由 convert/model_serving.go buildVllmModelServing 经 loadModelServingTemplate 渲染。
# ${PLACEHOLDER} 由 ReplacePlaceholders 替换。
#
# 结构: replicas=BACKEND_REPLICAS 个 ServingGroup, 每组单 leader Role:
#   - topologySpreadConstraints: 按 hostname 打散, maxSkew=1(同主机最多差 1, 均匀分布)
#   - gangPolicy.minRoleReplicas.leader: gang 门槛
#   - leader Role: entry 跑 runtime+engine 两容器, worker 跑 Ray worker(多节点张量并行)
#   - engine 有 preStop 排空探针: num_requests_running/waiting=0 才退出(无损下线)
# =============================================================================
apiVersion: workload.serving.volcano.sh/v1alpha1
kind: ModelServing
metadata: ${MODEL_SERVING_TEMPLATE_METADATA}
spec:
  schedulerName: ${SCHEDULER_NAME}          # 调度器名(默认 volcano)
  topologySpreadConstraints:               # 拓扑打散: 按 hostname 均匀分布, maxSkew=1
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          modelserving.volcano.sh/name: ${MODEL_NAME}
  replicas: ${BACKEND_REPLICAS}            # ServingGroup 数
  template:
    restartGracePeriodSeconds: 60
    gangPolicy:
      minRoleReplicas:
        leader: ${SERVER_REPLICAS}          # gang 门槛: leader 至少 N 个
    roles:
      - name: leader                         # 单 leader Role
        replicas: ${SERVER_REPLICAS}        # leader 实例数
        entryTemplate:
          metadata: ${SERVER_ENTRY_TEMPLATE_METADATA}
          spec:
            runtimeClassName: ${RUNTIME_CLASS_NAME}
            affinity: ${SERVER_AFFINITY}
            tolerations: ${SERVER_TOLERATIONS}
            initContainers: ${INIT_CONTAINERS}
            terminationGracePeriodSeconds: 300
            volumes: ${VOLUMES}
            containers:
              - name: runtime
                image: ${MODEL_SERVING_RUNTIME_IMAGE}
                ports:
                  - containerPort: ${MODEL_SERVING_RUNTIME_PORT}
                env: ${ENGINE_ENV}
                envFrom: ${MODEL_DOWNLOAD_ENVFROM}
                args:
                  - --port
                  - ${MODEL_SERVING_RUNTIME_PORT}
                  - --engine
                  - ${MODEL_SERVING_RUNTIME_ENGINE}
                  - --engine-base-url
                  - ${MODEL_SERVING_RUNTIME_URL}
                  - --engine-metrics-path
                  - ${MODEL_SERVING_RUNTIME_METRICS_PATH}
                  - --pod
                  - ${MODEL_SERVING_RUNTIME_POD}
                  - --model
                  - ${MODEL_NAME}
                readinessProbe:
                  httpGet:
                    path: /health
                    port: ${MODEL_SERVING_RUNTIME_PORT}
                  initialDelaySeconds: 5
                  periodSeconds: 10
              - name: engine
                image: ${ENGINE_SERVER_IMAGE}
                command: ${ENGINE_SERVER_COMMAND}
                env: ${ENGINE_ENV}
                resources: ${ENGINE_SERVER_RESOURCES}
                volumeMounts: ${VOLUME_MOUNTS}
                readinessProbe:
                  failureThreshold: 3
                  httpGet:
                    path: /health
                    port: ${ENGINE_PORT}
                    scheme: HTTP
                  initialDelaySeconds: 180
                  periodSeconds: 5
                  successThreshold: 1
                  timeoutSeconds: 1
                lifecycle:
                  preStop:
                    exec:
                      command:
                        - /bin/sh
                        - -c
                        - |
                          while true; do
                            METRICS=$(curl -s --max-time 2 http://localhost:${ENGINE_PORT}/metrics)
                            RUNNING=$(echo "$METRICS" | grep 'vllm:num_requests_running' | grep -v '#' | awk '{print $2}' || true)
                            WAITING=$(echo "$METRICS" | grep 'vllm:num_requests_waiting' | grep -v '#' | awk '{print $2}' || true)
                            if [ -z "$RUNNING" ]; then
                              echo "Terminating: Metrics endpoint unavailable, exiting preStop" >> /proc/1/fd/1
                              exit 0
                            fi
                            if [ "$RUNNING" = "0.0" ] && [ "$WAITING" = "0.0" ]; then
                              echo "Terminating: No active or waiting requests, safe to terminate" >> /proc/1/fd/1
                              exit 0
                            else
                              echo "Terminating: Running: $RUNNING, Waiting: $WAITING" >> /proc/1/fd/1
                              sleep 5
                            fi
                          done
        workerReplicas: ${WORKER_REPLICAS}
        workerTemplate:
          metadata: ${SERVER_WORKER_TEMPLATE_METADATA}
          spec:
            runtimeClassName: ${RUNTIME_CLASS_NAME}
            affinity: ${SERVER_AFFINITY}
            tolerations: ${SERVER_TOLERATIONS}
            volumes: ${VOLUMES}
            initContainers: ${INIT_CONTAINERS}
            containers:
              - name: ${BACKEND_NAME}-${BACKEND_TYPE}-worker
                image: ${ENGINE_SERVER_IMAGE}
                command:
                  - bash
                  - "-c"
                  - "chmod u+x examples/online_serving/multi-node-serving.sh && examples/online_serving/multi-node-serving.sh worker --ray_address=$(ENTRY_ADDRESS)"
                env: ${WORKER_ENV}
                resources: ${ENGINE_SERVER_RESOURCES}
                volumeMounts: ${VOLUME_MOUNTS}
